name: Build and Push Docker Images

on:
  push:
    branches: [ main ]

env:
  DOCKER_USERNAME: asimkhankhitran

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Build Backend
      run: |
        cd backend
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-backend:latest .
    
    - name: Push Backend
      run: |
        docker push ${{ env.DOCKER_USERNAME }}/devops-backend:latest
    
    - name: Build Frontend
      run: |
        cd frontend
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-frontend:latest .
    
    - name: Push Frontend
      run: |
        docker push ${{ env.DOCKER_USERNAME }}/devops-frontend:latest
    
    - name: Trivy Backend Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_USERNAME }}/devops-backend:latest
        format: 'table'
      continue-on-error: true
    
    - name: Trivy Frontend Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_USERNAME }}/devops-frontend:latest
        format: 'table'
      continue-on-error: true
