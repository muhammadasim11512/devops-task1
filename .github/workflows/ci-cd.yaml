name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_USERNAME: asimkhankhitran
  REGISTRY: docker.io

jobs:
  test:
    name: Test & Security Scan
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    
    - name: Run Unit Tests
      run: |
        cd backend
        pytest ../tests/ -v --tb=short
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        SECRET_KEY: test-secret-key
    
    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
      continue-on-error: true

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Extract Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_USERNAME }}/devops-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/devops-${{ matrix.service }}:buildcache
        cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/devops-${{ matrix.service }}:buildcache,mode=max
    
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_USERNAME }}/devops-${{ matrix.service }}:latest
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
      continue-on-error: true
    
    - name: Build Summary
      if: always()
      run: |
        echo "### 🐳 Build Status: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
        echo "- Image: ${{ env.DOCKER_USERNAME }}/devops-${{ matrix.service }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}
      continue-on-error: true
    
    - name: Deploy to Kubernetes
      run: |
        if ! kubectl cluster-info &>/dev/null; then
          echo "⚠️  KUBECONFIG not configured - skipping deployment"
          exit 0
        fi
        
        echo "📦 Deploying namespace and configs..."
        kubectl apply -f k8s/base/namespace.yaml || { echo "❌ Namespace failed"; exit 1; }
        kubectl apply -f k8s/base/configmap.yaml || { echo "❌ ConfigMap failed"; exit 1; }
        kubectl apply -f k8s/base/secret.yaml || { echo "❌ Secret failed"; exit 1; }
        kubectl apply -f k8s/base/serviceaccount.yaml || { echo "❌ ServiceAccount failed"; exit 1; }
        kubectl apply -f k8s/base/rbac.yaml || { echo "❌ RBAC failed"; exit 1; }
        
        echo "🗄️  Deploying Redis..."
        kubectl apply -f k8s/base/redis.yaml || { echo "❌ Redis failed"; exit 1; }
        
        echo "🚀 Deploying applications..."
        kubectl apply -f k8s/base/backend.yaml || { echo "❌ Backend failed"; exit 1; }
        kubectl apply -f k8s/base/frontend.yaml || { echo "❌ Frontend failed"; exit 1; }
        
        echo "🌐 Deploying ingress and policies..."
        kubectl apply -f k8s/base/ingress.yaml || { echo "❌ Ingress failed"; exit 1; }
        kubectl apply -f k8s/base/hpa.yaml || { echo "❌ HPA failed"; exit 1; }
        kubectl apply -f k8s/base/pdb.yaml || { echo "❌ PDB failed"; exit 1; }
        kubectl apply -f k8s/base/networkpolicy.yaml || { echo "❌ NetworkPolicy failed"; exit 1; }
        
        echo "✅ All resources deployed successfully"
    
    - name: Verify Deployment
      run: |
        if ! kubectl cluster-info &>/dev/null; then
          echo "⚠️  KUBECONFIG not configured - skipping verification"
          exit 0
        fi
        
        echo "⏳ Waiting for backend deployment..."
        kubectl rollout status deployment/backend -n devops-app --timeout=300s || { echo "❌ Backend rollout failed"; exit 1; }
        
        echo "⏳ Waiting for frontend deployment..."
        kubectl rollout status deployment/frontend -n devops-app --timeout=300s || { echo "❌ Frontend rollout failed"; exit 1; }
        
        echo "📊 Pod status:"
        kubectl get pods -n devops-app
        
        echo "✅ Deployment verification complete"
    
    - name: Run Smoke Tests
      run: |
        if ! kubectl cluster-info &>/dev/null; then
          echo "⚠️  KUBECONFIG not configured - skipping smoke tests"
          exit 0
        fi
        
        echo "🧪 Running smoke tests..."
        NODEPORT=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
        MASTER_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}' 2>/dev/null || echo "")
        
        if [ -z "$MASTER_IP" ] || [ -z "$NODEPORT" ]; then
          echo "⚠️  No external IP or NodePort - skipping smoke test"
          exit 0
        fi
        
        echo "Testing: http://$MASTER_IP:$NODEPORT/health"
        if curl -f -s http://$MASTER_IP:$NODEPORT/health; then
          echo "✅ Smoke test passed"
        else
          echo "❌ Smoke test failed"
          exit 1
        fi
    
    - name: Deployment Summary
      if: always()
      run: |
        if ! kubectl cluster-info &>/dev/null; then
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "⚠️  KUBECONFIG not configured - deployment skipped" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        
        echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        kubectl get pods -n devops-app -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Failed to get pods" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Pipeline Summary
    needs: [test, build, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Pipeline Status Summary
      run: |
        echo "### 📊 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🧪 Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🐳 Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🚀 Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.test.result }}" = "failure" ]; then
          echo "❌ **Tests failed** - Check test logs above" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.build.result }}" = "failure" ]; then
          echo "❌ **Build failed** - Check Docker build logs" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy.result }}" = "failure" ]; then
          echo "❌ **Deployment failed** - Check kubectl logs" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ **Pipeline completed successfully!**" >> $GITHUB_STEP_SUMMARY
        fi
