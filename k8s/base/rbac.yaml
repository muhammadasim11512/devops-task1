apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: devops-app
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-rolebinding
  namespace: devops-app
subjects:
- kind: ServiceAccount
  name: app-sa
  namespace: devops-app
roleRef:
  kind: Role
  name: app-role
  apiGroup: rbac.authorization.k8s.io
